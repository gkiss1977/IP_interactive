<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizing the Fourier Transform</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body { 
            margin: 0; 
            background-color: #050505; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            color: white;
            overflow: hidden;
        }
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 300px;
            background: rgba(10, 10, 10, 0.85);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #333;
            pointer-events: auto;
            backdrop-filter: blur(10px);
        }
        h1 { font-size: 18px; margin: 0 0 10px 0; color: #00d4ff; }
        p { font-size: 13px; color: #aaa; line-height: 1.5; }
        .control-group { margin-top: 20px; }
        label { display: block; font-size: 12px; margin-bottom: 5px; color: #eee; }
        input[type="range"] { width: 100%; cursor: pointer; }
        .math {
            font-family: "serif";
            font-style: italic;
            color: #ff0077;
            background: #1a1a1a;
            padding: 8px;
            border-radius: 4px;
            margin: 10px 0;
            text-align: center;
        }
        .legend {
            margin-top: 15px;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .legend-item { display: flex; align-items: center; gap: 8px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; }
    </style>
</head>
<body>
    <div id="ui-layer">
        <h1>Fourier Decomposition</h1>

        <div class="control-group">
            <label>Waveform Complexity (N)</label>
            <input type="range" id="harmonic-slider" min="1" max="5" step="1" value="3">
        </div>

        <div class="legend">
            <div class="legend-item">
                <div class="dot" style="background: #ffffff;"></div>
                <span>Composite Time Signal (Sum)</span>
            </div>
            <div class="legend-item">
                <div class="dot" style="background: #007aff;"></div>
                <span>Frequency Components (Basis)</span>
            </div>
        </div>
    </div>

    <script>
        let scene, camera, renderer, controls;
        let waves = [];
        let compositeWave;
        let params = {
            harmonics: 3,
            time: 0
        };

        const COLORS = [0x00d4ff, 0xff0077, 0x00ffaa, 0xffcc00, 0x9900ff];

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(18, 14, 24);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            // Grid and Helpers
            const grid = new THREE.GridHelper(40, 40, 0x222222, 0x111111);
            grid.position.y = -6;
            scene.add(grid);

            createWaves();

            // UI Listeners
            document.getElementById('harmonic-slider').addEventListener('input', (e) => {
                params.harmonics = parseInt(e.target.value);
                clearScene();
                createWaves();
            });

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function clearScene() {
            waves.forEach(w => scene.remove(w.mesh));
            if(compositeWave) scene.remove(compositeWave);
            waves = [];
        }

        function createWaves() {
            const pointsCount = 200;
            
            // Create harmonic waves (Basis)
            for (let i = 0; i < params.harmonics; i++) {
                const geometry = new THREE.BufferGeometry();
                const positions = new Float32Array(pointsCount * 3);
                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                
                const material = new THREE.LineBasicMaterial({ 
                    color: COLORS[i % COLORS.length],
                    transparent: true,
                    opacity: 0.8
                });
                
                const line = new THREE.Line(geometry, material);
                waves.push({
                    mesh: line,
                    freq: (i + 1),
                    amp: 2 / (i + 1)
                });
                scene.add(line);
            }

            // Create composite wave (Time Signal)
            const compGeom = new THREE.BufferGeometry();
            const compPos = new Float32Array(pointsCount * 3);
            compGeom.setAttribute('position', new THREE.BufferAttribute(compPos, 3));
            const compMat = new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 2.5 });
            compositeWave = new THREE.Line(compGeom, compMat);
            scene.add(compositeWave);
        }

        function updateWaveGeometry() {
            const pointsCount = 200;
            const width = 20;
            const compPositions = compositeWave.geometry.attributes.position.array;

            // Fixed Vertical Separation
            const timeVerticalOffset = 7; 
            const freqVerticalBaseline = 0;

            // Initialize composite line at the top
            for (let i = 0; i < pointsCount; i++) {
                compPositions[i * 3] = (i / pointsCount) * width - width / 2;
                compPositions[i * 3 + 1] = timeVerticalOffset; 
                compPositions[i * 3 + 2] = 0;
            }

            waves.forEach((wave, wIdx) => {
                const positions = wave.mesh.geometry.attributes.position.array;
                
                // Frequency components distributed along the Z axis
                const zOffset = wIdx * 4;

                for (let i = 0; i < pointsCount; i++) {
                    const x = (i / pointsCount) * width - width / 2;
                    const val = Math.sin(x * wave.freq + params.time) * wave.amp;
                    
                    // Set component wave point
                    positions[i * 3] = x;
                    positions[i * 3 + 1] = val + freqVerticalBaseline;
                    positions[i * 3 + 2] = zOffset;

                    // Add amplitude to the composite Time Signal at the top
                    compPositions[i * 3 + 1] += val;
                }
                wave.mesh.geometry.attributes.position.needsUpdate = true;
            });

            compositeWave.geometry.attributes.position.needsUpdate = true;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            params.time += 0.04;
            updateWaveGeometry();
            controls.update();
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
